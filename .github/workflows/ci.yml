name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter server exec tsc --noEmit

      - name: Typecheck client
        run: pnpm --filter client exec tsc --noEmit

      - name: Server unit tests
        run: pnpm --filter server test

      - name: Server coverage (critical paths)
        run: pnpm --filter server test:coverage
        continue-on-error: true

      - name: Production audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

  dependabot:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot configured via .github/dependabot.yml"
