name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter server exec tsc --noEmit

      - name: Typecheck client
        run: pnpm --filter client exec tsc --noEmit

      - name: Server unit tests
        run: pnpm --filter server test

      - name: Server coverage (critical paths)
        run: pnpm --filter server test:coverage

      - name: Production audit
        run: pnpm audit --prod --audit-level=high

      - name: Build shared
        run: pnpm --filter shared build

      - name: Build client
        run: pnpm --filter client build

      - name: Build server
        run: pnpm --filter server build

  e2e-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter client exec playwright install --with-deps chromium

      - name: Build client for preview
        run: pnpm --filter shared build && pnpm --filter client build

      - name: Public page e2e + axe
        working-directory: client
        env:
          CI: "1"
        run: pnpm exec playwright test e2e/smoke.spec.ts
